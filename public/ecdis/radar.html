<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hatteland Technology — HT Radar</title>
<meta name="theme-color" content="#020604">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="vendor/fonts/inter.css" rel="stylesheet">
<script src="./kiosk.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #020604; color: #b9f0cd;
    font-family: 'Inter', system-ui, sans-serif; touch-action: none; user-select: none;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pill {
    position: fixed; z-index: 20; display: inline-flex; align-items: center; gap: 10px;
    min-height: 44px; padding: 0 16px; border-radius: 12px;
    background: rgba(4, 14, 9, 0.85); border: 1px solid rgba(74, 222, 128, 0.25);
    color: #b9f0cd; font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; backdrop-filter: blur(8px);
  }
  .brand { left: 14px; top: 14px; }
  .brand img { height: 22px; background: #fff; border-radius: 6px; padding: 3px 6px; }
  .demo { left: 50%; top: 14px; transform: translateX(-50%); color: #fbbf24; border-color: rgba(251, 191, 36, 0.35); }
  .own { right: 14px; top: 14px; gap: 16px; font-variant-numeric: tabular-nums; }
  .own b { color: #4ade80; font-size: 14px; }
  .own span { color: rgba(185, 240, 205, 0.55); font-size: 9px; letter-spacing: 0.16em; }
  .ctrl {
    position: fixed; right: 14px; top: 50%; transform: translateY(-50%); z-index: 20;
    display: grid; gap: 8px; width: 92px;
  }
  .ctrl button, .navrow a {
    min-height: 48px; border: 1px solid rgba(74, 222, 128, 0.3); border-radius: 12px;
    background: rgba(4, 14, 9, 0.85); color: #b9f0cd; font: 700 12px/1 'Inter', system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(8px);
  }
  .ctrl button.on { background: rgba(74, 222, 128, 0.18); color: #4ade80; border-color: rgba(74, 222, 128, 0.6); }
  .ctrl .rng { font-size: 16px; color: #4ade80; }
  .sliders {
    position: fixed; left: 14px; bottom: 74px; z-index: 20; display: grid; gap: 6px;
    padding: 12px 14px; border-radius: 12px; background: rgba(4, 14, 9, 0.85);
    border: 1px solid rgba(74, 222, 128, 0.25); backdrop-filter: blur(8px); width: 210px;
  }
  .sliders label { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: rgba(185, 240, 205, 0.7); }
  .sliders input { width: 100%; accent-color: #4ade80; min-height: 30px; }
  .navrow { position: fixed; left: 14px; bottom: 14px; z-index: 20; display: flex; gap: 8px; }
  .navrow a { display: inline-grid; place-items: center; padding: 0 18px; text-decoration: none; min-height: 46px; }
  .navrow a.kiosk { background: rgba(255, 255, 255, 0.92); color: #1c1c1e; border-color: rgba(60, 60, 67, 0.2); }
  .ebl {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 20;
    font-variant-numeric: tabular-nums;
  }
  .ebl b { color: #4ade80; }
</style>
</head>
<body>
<canvas id="scope"></canvas>

<div class="pill brand"><img src="uploads/HT_Main_Logo_Black_Web.svg" alt="" /> HT Radar</div>
<div class="pill demo">Radar demo — not for navigation</div>
<div class="pill own">
  <span>POS</span><b id="rPos">—</b>
  <span>HDG</span><b id="rHdg">—</b>
  <span>SOG</span><b id="rSog">—</b>
  <span>COG</span><b id="rCog">—</b>
</div>

<div class="ctrl">
  <button id="rngUp" type="button">Range +</button>
  <button class="rng" id="rngVal" type="button">6 nm</button>
  <button id="rngDn" type="button">Range −</button>
  <button id="orientBtn" type="button">N-UP</button>
  <button id="trailsBtn" type="button" class="on">Trails</button>
  <button id="aisBtn" type="button" class="on">AIS</button>
  <button id="eblBtn" type="button">EBL off</button>
</div>

<div class="sliders">
  <label>Gain <input id="gain" type="range" min="20" max="100" value="72" /></label>
  <label>Sea <input id="sea" type="range" min="0" max="100" value="35" /></label>
  <label>Rain <input id="rain" type="range" min="0" max="100" value="15" /></label>
</div>

<div class="navrow">
  <a class="kiosk" href="/select.html" onpointerup="if(!event.isPrimary){event.preventDefault();window.location.href=this.href;}">Main kiosk</a>
  <a href="ht-ecdis.html" onclick="this.href='ht-ecdis.html'+location.search;" onpointerup="if(!event.isPrimary){event.preventDefault();window.location.href='ht-ecdis.html'+location.search;}">ECDIS</a>
</div>

<div class="pill ebl" id="eblOut" style="display:none">EBL <b id="eblBrg">—</b> · VRM <b id="eblRng">—</b></div>

<script>
(function () {
  "use strict";

  // ================= Seilas-sim: samme rute og tilstand som ECDIS =================
  // ECDIS lagrer mrd_ship/mrd_route (localStorage + server) hvert 5. sekund og
  // dodregner etter veggklokken. Radaren leser samme tilstand og gjor samme
  // dodregning, saa begge skjermene viser samme seilas - uten dobbel skriving.
  // Er ECDIS aapen samtidig, overtar dens direktesendte tilstand (BroadcastChannel).

  var DEFAULT_ROUTE = [
    { lat: 59.985, lon: 4.66 }, { lat: 60.04, lon: 4.78 }, { lat: 60.075, lon: 4.90 },
    { lat: 60.115, lon: 5.00 }, { lat: 60.165, lon: 5.08 }, { lat: 60.225, lon: 5.17 },
    { lat: 60.30, lon: 5.235 }, { lat: 60.345, lon: 5.27 }
  ];
  var CRUISE = 14.5;

  function distNm(a, b) {
    var dLat = (b.lat - a.lat) * 60;
    var dLon = (b.lon - a.lon) * 60 * Math.cos((a.lat + b.lat) / 2 * Math.PI / 180);
    return Math.hypot(dLat, dLon);
  }
  function bearingDeg(a, b) {
    var dLat = (b.lat - a.lat), dLon = (b.lon - a.lon) * Math.cos((a.lat + b.lat) / 2 * Math.PI / 180);
    return (Math.atan2(dLon, dLat) * 180 / Math.PI + 360) % 360;
  }
  function moveLL(lat, lon, brgDeg, nm) {
    var b = brgDeg * Math.PI / 180;
    return {
      lat: lat + Math.cos(b) * nm / 60,
      lon: lon + Math.sin(b) * nm / 60 / Math.cos(lat * Math.PI / 180)
    };
  }

  function loadJson(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }

  var route = DEFAULT_ROUTE;
  var savedRoute = loadJson("mrd_route");
  if (savedRoute && savedRoute.route && savedRoute.route.length > 1) route = savedRoute.route;

  var own = { lat: route[0].lat, lon: route[0].lon, hdg: bearingDeg(route[0], route[1]), cog: 0, sog: CRUISE, leg: 1 };
  own.cog = own.hdg;

  // Dodregning fra siste lagrede tilstand - identisk logikk som ECDIS.
  (function restore() {
    var snap = loadJson("mrd_ship");
    if (!snap || !snap.ship || !snap.savedAt) return;
    own.lat = snap.ship.lat; own.lon = snap.ship.lon;
    own.hdg = snap.ship.hdg || own.hdg; own.cog = snap.ship.cog || own.hdg;
    own.sog = snap.sailing ? Math.max(6, Math.min(16, snap.ship.sog || CRUISE)) : (snap.ship.sog || 0);
    own.leg = Math.max(1, Math.min(snap.activeLeg || 1, route.length - 1));
    var seconds = (Date.now() - snap.savedAt) / 1000;
    if (!snap.sailing || route.length < 2 || seconds < 20) return;
    var legLen = [], total = 0, i;
    for (i = 1; i < route.length; i++) { var d = distNm(route[i - 1], route[i]); legLen.push(d); total += d; }
    if (total < 0.1) return;
    var pos = 0;
    for (i = 1; i < own.leg; i++) pos += legLen[i - 1];
    var legD = legLen[own.leg - 1] || 0.0001;
    pos += Math.max(0, Math.min(legD, legD - distNm(own, route[own.leg])));
    var dist = (pos + own.sog * seconds / 3600) % total;
    var acc = 0, li = 1;
    for (; li < route.length - 1; li++) { if (acc + legLen[li - 1] >= dist) break; acc += legLen[li - 1]; }
    var fa = route[li - 1], fb = route[li];
    var f = Math.max(0, Math.min(1, (dist - acc) / (legLen[li - 1] || 1)));
    own.lat = fa.lat + (fb.lat - fa.lat) * f;
    own.lon = fa.lon + (fb.lon - fa.lon) * f;
    own.hdg = own.cog = bearingDeg(fa, fb);
    own.sog = CRUISE; own.leg = li;
  })();

  // Direktekobling til en aapen ECDIS (og dens ekte/simulerte AIS-maal)
  var live = null, liveAt = 0, liveTargets = null, liveTargetsAt = 0;
  try {
    var chan = new BroadcastChannel("meridian-helm");
    chan.onmessage = function (e) {
      var m = e.data;
      if (!m || m.type !== "state" || !m.ship) return;
      live = m.ship; liveAt = Date.now();
      if (m.targets && m.targets.length) { liveTargets = m.targets; liveTargetsAt = Date.now(); }
    };
  } catch (e) {}

  function ownTick(dt) {
    if (live && Date.now() - liveAt < 4000) {
      own.lat = live.lat; own.lon = live.lon;
      own.hdg = live.hdg; own.cog = live.cog; own.sog = live.sog;
      return;
    }
    if (own.sog < 0.2) return;
    var wp = route[own.leg];
    if (!wp) { own.leg = 1; return; }
    var brg = bearingDeg(own, wp);
    var diff = ((brg - own.hdg + 540) % 360) - 180;
    var rate = Math.min(3.2, Math.abs(diff)) * Math.sign(diff);
    own.hdg = (own.hdg + rate * dt + 360) % 360;
    own.cog = own.hdg;
    own.sog += (CRUISE - own.sog) * Math.min(1, dt * 0.25);
    var step = moveLL(own.lat, own.lon, own.hdg, own.sog * dt / 3600);
    own.lat = step.lat; own.lon = step.lon;
    if (distNm(own, wp) < 0.16) {
      own.leg += 1;
      if (own.leg >= route.length) { // ny seilas fra start, som ECDIS-attracten
        own.lat = route[0].lat; own.lon = route[0].lon;
        own.leg = 1; own.hdg = own.cog = bearingDeg(route[0], route[1]);
      }
    }
  }

  // ================= AIS-maal: felles trafikk-sim naar ECDIS ikke er aapen =================
  var NAMES = ["NORDIC STAR", "BERGEN PEARL", "FJORD PILOT", "VESTLAND TRADER", "SKAGERAK", "MS SOLUND", "KYSTVAKT 3"];
  var simTargets = [];
  (function seedTargets() {
    // Trafikken saas rundt eget skip (1,5-8 nm unna) saa skopet alltid har ekko.
    for (var i = 0; i < NAMES.length; i++) {
      var a = i * 2.399963; // gyllen vinkel gir jevn men "tilfeldig" spredning
      var rNm = 1.5 + (i * 53 % 100) / 100 * 6.5;
      var p = moveLL(own.lat, own.lon, a * 180 / Math.PI, rNm);
      simTargets.push({
        name: NAMES[i],
        lat: p.lat,
        lon: p.lon,
        cog: (a * 180 / Math.PI + 120 + (i % 2) * 120) % 360,
        sog: 6 + (i * 37) % 11,
        hdg: 0
      });
    }
  })();
  function targetsTick(dt) {
    for (var i = 0; i < simTargets.length; i++) {
      var t = simTargets[i];
      t.hdg = t.cog;
      var step = moveLL(t.lat, t.lon, t.cog, t.sog * dt / 3600);
      t.lat = step.lat; t.lon = step.lon;
      // hold trafikken rundt eget skip: myk sving tilbake naar de drar for langt
      if (distNm(t, own) > 11) {
        var back = bearingDeg(t, own);
        var diff = ((back - t.cog + 540) % 360) - 180;
        t.cog = (t.cog + Math.sign(diff) * Math.min(16, Math.abs(diff)) * dt * 2.2 + 360) % 360;
      }
    }
  }
  function targets() {
    if (liveTargets && Date.now() - liveTargetsAt < 6000) return liveTargets;
    return simTargets;
  }

  // ================= Kystlinje for landekko =================
  var coast = null;
  (function loadCoast() {
    var urls = [
      "/proxy?url=" + encodeURIComponent("https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_10m_land.geojson"),
      "https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_10m_land.geojson",
      "/proxy?url=" + encodeURIComponent("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_land.geojson")
    ];
    var i = 0;
    (function attempt() {
      if (i >= urls.length) return;
      fetch(urls[i]).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) {
        var B = { latMin: 54, latMax: 73, lonMin: -3, lonMax: 33 };
        var polys = [];
        (j.features || []).forEach(function (f) {
          var g = f.geometry; if (!g) return;
          var parts = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
          parts.forEach(function (poly) {
            var ring = poly[0], hit = false;
            for (var p = 0; p < ring.length; p++) {
              if (ring[p][1] > B.latMin && ring[p][1] < B.latMax && ring[p][0] > B.lonMin && ring[p][0] < B.lonMax) { hit = true; break; }
            }
            if (hit) polys.push(poly);
          });
        });
        coast = polys; landDirty = true;
      }).catch(function () { i += 1; attempt(); });
    })();
  })();

  // ================= PPI-radar =================
  var scope = document.getElementById("scope");
  var ctx = scope.getContext("2d");
  var echoC = document.createElement("canvas");
  var echo = echoC.getContext("2d");
  var landC = document.createElement("canvas");
  var landCx = landC.getContext("2d");

  var RANGES = [0.75, 1.5, 3, 6, 12, 24];
  var state = {
    range: 6, headUp: false, trails: true, ais: true,
    gain: 0.72, sea: 0.35, rain: 0.15,
    ebl: null // {brg, rng}
  };
  var sweep = 0, lastT = performance.now(), landDirty = true, landRef = null;
  var trailDots = []; // {x-geo: lat/lon, born}
  var lastTrailAt = 0;

  var W = 0, H = 0, CX = 0, CY = 0, R = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    scope.width = W * DPR; scope.height = H * DPR;
    echoC.width = W * DPR; echoC.height = H * DPR;
    landC.width = W * DPR; landC.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    echo.setTransform(DPR, 0, 0, DPR, 0, 0);
    landCx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2; CY = H / 2;
    R = Math.min(W, H) / 2 - 64;
    landDirty = true;
  }
  window.addEventListener("resize", resize);
  resize();

  function kPx() { return R / state.range; }
  function geoToScope(lat, lon) {
    // nm-avvik fra eget skip, nord opp; rotasjon gjores i canvas-transformen
    var n = (lat - own.lat) * 60;
    var e = (lon - own.lon) * 60 * Math.cos(own.lat * Math.PI / 180);
    return { x: e * kPx(), y: -n * kPx() }; // relativt sentrum
  }

  // Land prerendres (dyrt) og stemples inn av sveipet (billig).
  function renderLand() {
    landCx.clearRect(0, 0, W, H);
    if (!coast) { landDirty = false; landRef = { lat: own.lat, lon: own.lon, range: state.range }; return; }
    landCx.save();
    landCx.translate(CX, CY);
    landCx.fillStyle = "rgba(84, 226, 130, 0.85)";
    landCx.beginPath();
    var k = kPx(), cosLat = Math.cos(own.lat * Math.PI / 180), lim = state.range * 1.5;
    for (var pi = 0; pi < coast.length; pi++) {
      var poly = coast[pi];
      for (var ri = 0; ri < poly.length; ri++) {
        var ring = poly[ri], started = false;
        for (var vi = 0; vi < ring.length; vi++) {
          var n = (ring[vi][1] - own.lat) * 60, e = (ring[vi][0] - own.lon) * 60 * cosLat;
          if (vi % 1 !== 0) continue;
          var x = e * k, y = -n * k;
          if (!started) { landCx.moveTo(x, y); started = true; } else landCx.lineTo(x, y);
        }
        if (started) landCx.closePath();
      }
    }
    landCx.fill("evenodd");
    landCx.restore();
    landDirty = false;
    landRef = { lat: own.lat, lon: own.lon, range: state.range };
  }

  function stampSector(a0, a1) {
    // Stemple ekko i sektoren sveipet nettopp passerte
    echo.save();
    echo.translate(CX, CY);
    if (state.headUp) echo.rotate(-own.hdg * Math.PI / 180);
    echo.beginPath();
    echo.moveTo(0, 0);
    echo.arc(0, 0, R, a0 - Math.PI / 2, a1 - Math.PI / 2);
    echo.closePath();
    echo.clip();

    // Landekko fra prerendret bilde (tegnet i nord-opp rundt sentrum)
    echo.drawImage(landC, 0, 0, landC.width, landC.height, -CX, -CY, W, H);

    // Maal-ekko
    var list = targets();
    for (var i = 0; i < list.length; i++) {
      var t = list[i]; if (t.lat == null) continue;
      var p = geoToScope(t.lat, t.lon);
      var d = Math.hypot(p.x, p.y);
      if (d > R) continue;
      var blob = Math.max(3.4, 7 - d / R * 3);
      echo.fillStyle = "rgba(120, 255, 170, 0.95)";
      echo.beginPath();
      echo.ellipse(p.x, p.y, blob * 1.35, blob, Math.atan2(p.y, p.x) + Math.PI / 2, 0, 7);
      echo.fill();
    }

    // Sjoclutter naer sentrum + regnclutter i drivende felt
    var mid = (a0 + a1) / 2, span = Math.max(0.02, a1 - a0);
    var seaN = Math.floor(state.sea * 26 * span * 12);
    echo.fillStyle = "rgba(110, 240, 160, 0.5)";
    for (i = 0; i < seaN; i++) {
      var ang = a0 + Math.random() * span - Math.PI / 2;
      var rr = Math.pow(Math.random(), 2.2) * R * 0.55;
      echo.fillRect(Math.cos(ang) * rr, Math.sin(ang) * rr, 1.6, 1.6);
    }
    var rainN = Math.floor(state.rain * 20 * span * 12);
    var rx = Math.cos(performance.now() / 60000) * R * 0.45, ry = Math.sin(performance.now() / 80000) * R * 0.4;
    echo.fillStyle = "rgba(96, 220, 150, 0.32)";
    for (i = 0; i < rainN; i++) {
      var px = rx + (Math.random() - 0.5) * R * 0.5, py = ry + (Math.random() - 0.5) * R * 0.4;
      if (Math.hypot(px, py) < R) echo.fillRect(px, py, 2.2, 2.2);
    }
    echo.restore();
  }

  function bearingRing() {
    ctx.save();
    ctx.translate(CX, CY);
    var rot = state.headUp ? -own.hdg * Math.PI / 180 : 0;
    ctx.rotate(rot);
    ctx.strokeStyle = "rgba(120, 230, 165, 0.5)";
    ctx.fillStyle = "rgba(150, 240, 185, 0.75)";
    ctx.lineWidth = 1;
    ctx.font = "600 10px Inter";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (var b = 0; b < 360; b += 5) {
      var a = b * Math.PI / 180 - Math.PI / 2;
      var len = b % 30 === 0 ? 10 : b % 10 === 0 ? 7 : 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * (R - len), Math.sin(a) * (R - len));
      ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
      ctx.stroke();
      if (b % 30 === 0) {
        ctx.save();
        ctx.translate(Math.cos(a) * (R + 16), Math.sin(a) * (R + 16));
        ctx.rotate(-rot);
        ctx.fillText(String(b).padStart(3, "0"), 0, 0);
        ctx.restore();
      }
    }
    ctx.restore();
  }

  function overlay() {
    ctx.save();
    ctx.translate(CX, CY);
    var rot = state.headUp ? -own.hdg * Math.PI / 180 : 0;

    // avstandsringer
    ctx.strokeStyle = "rgba(110, 220, 155, 0.28)";
    ctx.fillStyle = "rgba(150, 240, 185, 0.6)";
    ctx.lineWidth = 1;
    ctx.font = "600 9px Inter";
    ctx.textAlign = "left";
    for (var i = 1; i <= 4; i++) {
      var rr = R * i / 4;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7); ctx.stroke();
      ctx.fillText((state.range * i / 4).toFixed(state.range < 3 ? 2 : 1) + " nm", 6, -rr + 12);
    }

    ctx.rotate(rot);
    // kurslinje
    var ha = own.hdg * Math.PI / 180 - Math.PI / 2;
    ctx.strokeStyle = "rgba(150, 255, 190, 0.85)";
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ha) * R, Math.sin(ha) * R); ctx.stroke();

    // nordmerke
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.moveTo(0, -R + 2); ctx.lineTo(-5, -R + 12); ctx.lineTo(5, -R + 12); ctx.closePath();
    ctx.fill();

    // AIS-vektorer og navn
    if (state.ais) {
      var list = targets();
      ctx.font = "600 10px Inter";
      ctx.textAlign = "left";
      for (i = 0; i < list.length; i++) {
        var t = list[i]; if (t.lat == null) continue;
        var p = geoToScope(t.lat, t.lon);
        if (Math.hypot(p.x, p.y) > R) continue;
        var ca = (t.cog || 0) * Math.PI / 180 - Math.PI / 2;
        var vl = Math.min(R * 0.2, (t.sog || 0) * kPx() / 10); // 6-min vektor
        ctx.strokeStyle = "rgba(140, 235, 255, 0.9)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + Math.cos(ca) * vl, p.y + Math.sin(ca) * vl);
        ctx.stroke();
        ctx.strokeRect(p.x - 5, p.y - 5, 10, 10);
        if (t.name) {
          ctx.save();
          ctx.translate(p.x + 9, p.y - 9);
          ctx.rotate(-rot);
          ctx.fillStyle = "rgba(170, 240, 255, 0.85)";
          ctx.fillText(t.name, 0, 0);
          ctx.restore();
        }
      }
    }

    // eget skip
    ctx.fillStyle = "#eafff2";
    ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, 7); ctx.fill();

    // EBL / VRM
    if (state.ebl) {
      var ea = state.ebl.brg * Math.PI / 180 - Math.PI / 2;
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(251, 191, 36, 0.9)";
      ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ea) * R, Math.sin(ea) * R); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, Math.min(R, state.ebl.rng * kPx()), 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }

    // sveip
    var sa = sweep - Math.PI / 2;
    var grd = ctx.createConicGradient ? null : null;
    ctx.strokeStyle = "rgba(120, 255, 170, 0.9)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(sa) * R, Math.sin(sa) * R); ctx.stroke();

    ctx.restore();

    // maske utenfor skopet
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.arc(CX, CY, R + 1, 0, 7, true);
    ctx.fillStyle = "#020604";
    ctx.fill("evenodd");
    ctx.restore();

    bearingRing();
  }

  function drawTrails(dtMs) {
    if (!state.trails) return;
    var now = performance.now();
    if (now - lastTrailAt > 2000) {
      lastTrailAt = now;
      var list = targets();
      for (var i = 0; i < list.length; i++) {
        if (list[i].lat == null) continue;
        trailDots.push({ lat: list[i].lat, lon: list[i].lon, born: now });
      }
      while (trailDots.length > 600) trailDots.shift();
    }
    ctx.save();
    ctx.translate(CX, CY);
    if (state.headUp) ctx.rotate(-own.hdg * Math.PI / 180);
    for (var d = 0; d < trailDots.length; d++) {
      var age = (now - trailDots[d].born) / 90000;
      if (age > 1) continue;
      var p = geoToScope(trailDots[d].lat, trailDots[d].lon);
      if (Math.hypot(p.x, p.y) > R) continue;
      ctx.fillStyle = "rgba(110, 230, 160," + (0.5 * (1 - age)).toFixed(3) + ")";
      ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
    ctx.restore();
  }

  function frame(ts) {
    var dt = Math.min(0.1, (ts - lastT) / 1000 || 0);
    lastT = ts;

    ownTick(dt);
    targetsTick(dt);

    // land maa retegnes naar skipet har flyttet seg litt eller range endret
    if (!landDirty && landRef) {
      if (landRef.range !== state.range || distNm(landRef, own) > state.range * 0.02) landDirty = true;
    }
    if (landDirty) renderLand();

    // sveip: 24 rpm
    var prev = sweep;
    sweep = (sweep + dt * (Math.PI * 2) / 2.5) % (Math.PI * 2);
    // fade av ettergloden (fartsuavhengig, ~3.5 s)
    echo.save();
    echo.setTransform(1, 0, 0, 1, 0, 0);
    echo.globalCompositeOperation = "destination-out";
    echo.fillStyle = "rgba(0,0,0," + Math.min(0.2, dt / 3.5) + ")";
    echo.fillRect(0, 0, echoC.width, echoC.height);
    echo.restore();
    if (sweep < prev) { stampSector(prev, Math.PI * 2); stampSector(0, sweep); }
    else stampSector(prev, sweep);

    // komposisjon
    ctx.fillStyle = "#020604";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, 7); ctx.clip();
    ctx.fillStyle = "#04120a";
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0.2, state.gain);
    ctx.drawImage(echoC, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.restore();
    drawTrails();
    overlay();

    // readout
    var latD = Math.abs(own.lat), lonD = Math.abs(own.lon);
    document.getElementById("rPos").textContent =
      Math.floor(latD) + "°" + ((latD % 1) * 60).toFixed(1) + "'" + (own.lat >= 0 ? "N" : "S") + " " +
      String(Math.floor(lonD)).padStart(3, "0") + "°" + ((lonD % 1) * 60).toFixed(1) + "'" + (own.lon >= 0 ? "E" : "W");
    document.getElementById("rHdg").textContent = own.hdg.toFixed(0).padStart(3, "0") + "°";
    document.getElementById("rSog").textContent = own.sog.toFixed(1) + " kn";
    document.getElementById("rCog").textContent = own.cog.toFixed(0).padStart(3, "0") + "°";

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ================= Kontroller =================
  function bindTap(el, fn) { el.addEventListener("pointerup", function (e) { e.preventDefault(); fn(); }); }

  bindTap(document.getElementById("rngUp"), function () {
    var i = RANGES.indexOf(state.range);
    if (i < RANGES.length - 1) { state.range = RANGES[i + 1]; landDirty = true; echoClear(); }
    document.getElementById("rngVal").textContent = state.range + " nm";
  });
  bindTap(document.getElementById("rngDn"), function () {
    var i = RANGES.indexOf(state.range);
    if (i > 0) { state.range = RANGES[i - 1]; landDirty = true; echoClear(); }
    document.getElementById("rngVal").textContent = state.range + " nm";
  });
  function echoClear() {
    echo.save(); echo.setTransform(1, 0, 0, 1, 0, 0);
    echo.clearRect(0, 0, echoC.width, echoC.height); echo.restore();
  }
  var orientBtn = document.getElementById("orientBtn");
  bindTap(orientBtn, function () {
    state.headUp = !state.headUp;
    orientBtn.textContent = state.headUp ? "H-UP" : "N-UP";
    echoClear();
  });
  var trailsBtn = document.getElementById("trailsBtn");
  bindTap(trailsBtn, function () {
    state.trails = !state.trails;
    trailDots.length = 0;
    trailsBtn.classList.toggle("on", state.trails);
  });
  var aisBtn = document.getElementById("aisBtn");
  bindTap(aisBtn, function () {
    state.ais = !state.ais;
    aisBtn.classList.toggle("on", state.ais);
  });
  var eblBtn = document.getElementById("eblBtn");
  bindTap(eblBtn, function () {
    state.ebl = null;
    document.getElementById("eblOut").style.display = "none";
  });

  document.getElementById("gain").addEventListener("input", function () { state.gain = this.value / 100; });
  document.getElementById("sea").addEventListener("input", function () { state.sea = this.value / 100; });
  document.getElementById("rain").addEventListener("input", function () { state.rain = this.value / 100; });

  // EBL/VRM: dra paa skopet
  var eblActive = false;
  function setEbl(clientX, clientY) {
    var dx = clientX - CX, dy = clientY - CY;
    var rot = state.headUp ? own.hdg * Math.PI / 180 : 0;
    var brg = ((Math.atan2(dx, -dy) + rot) * 180 / Math.PI + 360) % 360;
    var rng = Math.min(state.range, Math.hypot(dx, dy) / kPx());
    state.ebl = { brg: brg, rng: rng };
    document.getElementById("eblOut").style.display = "";
    document.getElementById("eblBrg").textContent = brg.toFixed(1).padStart(5, "0") + "°";
    document.getElementById("eblRng").textContent = rng.toFixed(2) + " nm";
  }
  scope.addEventListener("pointerdown", function (e) {
    if (Math.hypot(e.clientX - CX, e.clientY - CY) > R) return;
    eblActive = true;
    try { scope.setPointerCapture(e.pointerId); } catch (x) {}
    setEbl(e.clientX, e.clientY);
  });
  scope.addEventListener("pointermove", function (e) { if (eblActive) setEbl(e.clientX, e.clientY); });
  ["pointerup", "pointercancel"].forEach(function (ev) {
    scope.addEventListener(ev, function () { eblActive = false; });
  });

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
