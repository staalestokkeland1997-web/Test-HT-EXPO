<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HT ECDIS">
  <!-- HT ECDIS: kompassnaal paa sjokartblaa flate.
       Det forrige ikonet hadde ring, tonaal og senterprikk oppaa hverandre og
       kokte ned til en blaa klatt i en 16 px fane. Her er alt unntatt selve
       naala fjernet, og naala fyller flata - da leses formen ogsaa naar den er
       liten. Bretten (den lysere halvdelen) er det eneste som skiller den fra
       en vanlig pil, og gjor den til et kompass. -->
  <defs>
    <linearGradient id="htEcdisBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#0A6FE0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#htEcdisBg)"/>
  <path d="M32 8 L42 52 L32 44 Z" fill="#ffffff" fill-opacity=".68"/>
  <path d="M32 8 L22 52 L32 44 Z" fill="#ffffff"/>
</svg>
