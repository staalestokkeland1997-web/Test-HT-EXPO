<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HT Game Kiosk | Hatteland Challenge</title>
    <link rel="stylesheet" href="/styles.css?v=20260428ports" />
  </head>
  <body>
    <main class="admin-shell selector-shell">
      <section class="admin-panel">
        <div class="admin-header">
          <div>
            <p class="eyebrow">Hatteland Technology</p>
            <h1>HT Game Kiosk</h1>
          </div>
          <div class="cta-row">
            <a class="ghost-button" href="/admin.html">Admin</a>
            <a id="openKioskLink" class="ghost-button" href="#">Open selected game</a>
          </div>
        </div>
        <p class="subtle-note">Choose a branded touch challenge. All games run in this fullscreen kiosk.</p>
        <div class="game-selector-grid">
          <button class="game-selector-card" data-game="rush" type="button"><span>Competition mode</span><strong>Harbor Rush Challenge</strong><small>One-player record chase.</small></button>
          <button class="game-selector-card" data-game="duel" type="button"><span>Stand battle mode</span><strong>Bridge Duel 1v1</strong><small>Two-player harbor control with attacks.</small></button>
          <button class="game-selector-card" data-game="airhockey" type="button"><span>Arcade mode</span><strong>HT Air Hockey</strong><small>Fast Hatteland branded air hockey.</small></button>
        </div>
        <p id="selectorStatus" class="subtle-note" aria-live="polite"></p>
      </section>
    </main>
    <script>
      (function () {
        var status = document.getElementById("selectorStatus");
        var openKioskLink = document.getElementById("openKioskLink");
        var active = localStorage.getItem("selectedGame") || "rush";

        function getGameUrl(game) {
          var path = "harbor-rush-standalone.html";
          if (game === "duel") path = "bridge-duel-standalone.html";
          if (game === "airhockey") path = "air-hockey-standalone.html";
          return path + "?v=" + Date.now();
        }

        function updateOpenLink(game) {
          openKioskLink.href = getGameUrl(game);
        }

        function openGame(game) {
          localStorage.setItem("selectedGame", game);
          updateOpenLink(game);
          window.location.href = getGameUrl(game);
        }

        updateOpenLink(active);
        var buttons = document.querySelectorAll("[data-game]");
        for (var i = 0; i < buttons.length; i += 1) {
          (function (button) {
            if (button.getAttribute("data-game") === active) button.className += " game-selector-card--active";
            button.addEventListener("click", function () { openGame(button.getAttribute("data-game")); }, false);
            button.addEventListener("touchend", function (event) { event.preventDefault(); openGame(button.getAttribute("data-game")); }, false);
          })(buttons[i]);
        }
      })();
    </script>
  </body>
</html>
